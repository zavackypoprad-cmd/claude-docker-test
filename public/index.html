<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Claude Docker Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        .completed-text {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-900 mb-2">📝 Todo App</h1>
            <p class="text-gray-600">Jednoduché řízení úkolů s PostgreSQL</p>
        </header>

        <!-- Add Todo Form -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <form id="todo-form" class="flex gap-3">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Co potřebuješ udělat?"
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    maxlength="255"
                    required
                />
                <button
                    type="submit"
                    id="add-button"
                    class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Přidat
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-8 hidden">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
            <p class="mt-4 text-gray-600">Načítám úkoly...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 fade-in">
            <div class="flex items-center">
                <span class="text-xl mr-2">⚠️</span>
                <p id="error-text"></p>
            </div>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6 fade-in">
            <div class="flex items-center">
                <span class="text-xl mr-2">✅</span>
                <p id="success-text"></p>
            </div>
        </div>

        <!-- Todos List -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Stats Bar -->
            <div class="bg-indigo-50 px-6 py-3 border-b border-indigo-100">
                <div class="flex justify-between text-sm text-indigo-700">
                    <span>Celkem: <strong id="total-count">0</strong></span>
                    <span>Aktivní: <strong id="active-count">0</strong></span>
                    <span>Hotové: <strong id="completed-count">0</strong></span>
                </div>
            </div>

            <!-- Todos Container -->
            <div id="todos-container">
                <!-- Empty State -->
                <div id="empty-state" class="text-center py-12 px-6">
                    <div class="text-6xl mb-4">📋</div>
                    <h3 class="text-xl font-semibold text-gray-700 mb-2">Žádné úkoly</h3>
                    <p class="text-gray-500">Přidej svůj první úkol a začni organizovat svůj den!</p>
                </div>

                <!-- Todos List -->
                <ul id="todos-list" class="divide-y divide-gray-200">
                    <!-- Todo items will be inserted here -->
                </ul>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center mt-8 text-gray-600 text-sm">
            <p>Vytvořeno s Claude Code | PostgreSQL + Node.js + Express</p>
        </footer>
    </div>

    <script src="/app.js"></script>
</body>
</html>
